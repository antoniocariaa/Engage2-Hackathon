paths:
  data_dir: .
  train: train.csv
  validation: validation.csv
  test: test.csv
  sample_submission: sample_submission.csv
  cache_dir: cache
  reports_dir: reports
  artifacts_dir: artifacts
  submissions_dir: submissions

seed: 42
n_folds: 4
n_jobs: 8

lgb_base:
  learning_rate: 0.05
  num_leaves: 31
  min_data_in_leaf: 200
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  max_bin: 255
  verbose: -1
  deterministic: true
  force_row_wise: true

max_rounds: 2000
early_stopping_rounds: 100
